# autotagTT worker: idles until Starplayer's "Run" button (or the nightly schedule) asks for a job, then embeds new
# covers and trains every enabled tag. Add it to the Dockge stack next to starplayer.
# Set ARCHIVE_PATH to the host folder that Starplayer mounts as /archive (the one containing data/.appdata).
# Least privilege: the archive is mounted read-only; only the autotag/ output folder is writable.
services:
  autotagtt:
    image: ghcr.io/nullredvector/autotagtt:latest
    command: ["worker"]
    runtime: nvidia
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true      # lets Watchtower pick up new builds
    environment:
      - ARCHIVE_DIR=/archive
      - NVIDIA_VISIBLE_DEVICES=all
      # - TZ=America/New_York         # the nightly schedule uses this container's local time
    volumes:
      - ${ARCHIVE_PATH:?set ARCHIVE_PATH to the archive folder}:/archive:ro
      - ${ARCHIVE_PATH}/data/.appdata/autotag:/archive/data/.appdata/autotag:rw
      - autotagtt-models:/models    # HF model cache (~4 GB, downloaded once)
    shm_size: 2g
volumes:
  autotagtt-models:
