# autotagTT worker: idles until kashibox's "Run" button (or the nightly schedule) asks for a job, then embeds new
# covers and trains every enabled tag. Add it to the Dockge stack next to kashibox.
# Set ARCHIVE_PATH to the host folder that kashibox mounts as /archive (the one containing data/.appdata).
# Least privilege: the archive is mounted read-only; only the autotag/ output folder is writable.
services:
  autotagtt:
    image: ghcr.io/nullredvector/autotagtt:latest
    command: ["worker"]
    runtime: nvidia
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true      # lets Watchtower pick up new builds
    environment:
      - ARCHIVE_DIR=/archive
      - NVIDIA_VISIBLE_DEVICES=all
      # - AUTOTAGTT_THREADS=8        # CPU threads for training/frame extraction (the host has 16 cores)
      # - TZ=America/New_York         # the nightly schedule uses this container's local time
      # Push notifications (ntfy), same settings as ttpull. Leave NTFY_URL empty to disable. Messages carry counts only.
      - NTFY_URL=${NTFY_URL:-}
      - NTFY_TOKEN=${NTFY_TOKEN:-}
      - NOTIFY_EVENTS=${NOTIFY_EVENTS:-done,failed}
    volumes:
      - ${ARCHIVE_PATH:?set ARCHIVE_PATH to the archive folder}:/archive:ro
      - ${ARCHIVE_PATH}/data/.appdata/autotag:/archive/data/.appdata/autotag:rw
      - autotagtt-models:/models    # HF model cache (~4 GB, downloaded once)
    shm_size: 2g
    # The scorer (HTTP, POST /score) is reached by other containers on the compose network as http://autotagtt:8090.
    # Never publish this port: it has no login and is only meant for the scout.
    expose:
      - "8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8090/health', timeout=5).status == 200 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
volumes:
  autotagtt-models:
